<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Для Леночки</title>
  <style>
    :root { color-scheme:dark; --ink:#f4e8ec; --rose:#ff9ebe; }
    * { box-sizing:border-box; }
    html,body { min-width:320px; min-height:100%; margin:0; }
    body {
      min-height:100vh;
      min-height:100svh;
      color:var(--ink);
      background:radial-gradient(ellipse at 50% 48%,#17121a 0%,#09090d 52%,#030305 100%);
      font-family:Georgia,"Times New Roman",serif;
    }
    .gift {
      position:relative;
      display:flex;
      min-height:100vh;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:26px 16px 24px;
      isolation:isolate;
    }
    .intro,.dedication { text-align:center; }
    .intro { max-width:620px; }
    .kicker {
      margin:0 0 13px;
      color:#d994ab;
      font:600 11px/1.4 Arial,sans-serif;
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    h1 {
      margin:0;
      color:#fff1f5;
      font-size:clamp(30px,6vw,48px);
      font-weight:400;
      line-height:1.12;
    }
    h1 em { color:var(--rose); font-weight:400; }
    .bouquet-wrap {
      display:flex;
      width:min(96vw,660px);
      height:min(66vh,660px);
      min-height:340px;
      align-items:center;
      justify-content:center;
      margin:-3px 0 -12px;
    }
    svg { display:block; width:100%; height:100%; overflow:visible; }
    .dedication { margin-top:-3px; }
    .dedication .divider {
      display:block;
      width:54px;
      height:1px;
      margin:0 auto 13px;
      background:#bc708c;
    }
    .dedication p {
      margin:0;
      color:#c5aeb7;
      font-size:14px;
      font-style:italic;
    }
    .dedication strong {
      display:block;
      margin-top:7px;
      color:#ffabc4;
      font-size:clamp(27px,5vw,36px);
      font-weight:400;
    }
    .line { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.4; }
    .digital { shape-rendering:crispEdges; }
    @media (max-height:700px) {
      .gift { padding:18px 16px; }
      .bouquet-wrap { width:min(72vh,600px); height:min(62vh,600px); min-height:280px; margin:-8px 0 -18px; }
      .kicker { margin-bottom:7px; }
    }
  </style>
</head>
<body>
  <main class="gift">
    <header class="intro">
      <p class="kicker">Собран с теплом</p>
      <h1>Леночка,<br><em>этот букет для тебя</em></h1>
    </header>

    <section class="bouquet-wrap" aria-label="Букет для Леночки">
      <svg viewBox="0 0 620 600" role="img">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <pattern id="pGreen" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#58a864" stroke-width="2"/><path d="M0 0L8 8" stroke="#91c95f" stroke-width=".7"/></pattern>
          <pattern id="pLight" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#f7f0ae" stroke-width="2"/><path d="M0 0L7 7" stroke="#95bc66" stroke-width="1"/></pattern>
        </defs>

        <!-- stems -->
        <g filter="url(#glow)">
          <g class="line" stroke="#5d9a58">
            <path d="M300 300C290 400 270 480 250 570"/><path d="M338 300C340 400 338 490 344 575"/><path d="M260 304C255 390 220 455 192 532"/><path d="M382 306C390 392 430 456 458 525"/><path d="M318 310C315 410 300 502 286 575"/><path d="M225 300C245 390 250 470 242 548"/><path d="M405 300C430 374 450 430 474 500"/>
          </g>
          <g class="line" stroke="#b1a77c"><path d="M310 315L272 425M326 315L360 430M360 315L398 414M275 318L238 405M397 320L443 394"/></g>
        </g>

        <!-- left pink flower -->
        <g filter="url(#glow)">
          <g fill="#f3a3c9"><path d="M95 220l20-24 24 9 15 20-14 24-25 7-22-15z"/><path d="M134 214l20-19 27 8 12 20-16 22-28 3z"/><path d="M170 218l18-26 25 4 17 21-13 23-28 5z"/><path d="M207 224l20-18 25 9 11 22-18 19-27-2z"/></g>
          <g class="line" stroke="#ffe0ef"><path d="M105 222l31-7m-18 35l48-27m13 17l39-29m-4 56l51-30"/></g>
        </g>

        <!-- yellow flower -->
        <g filter="url(#glow)">
          <path d="M48 298l28-30 39 6 29 27-12 30-38 15-38-16z" fill="#dec66c"/><path d="M69 287l35 15 33-17m-75 37l42-14 38 14M82 267l8 63m44-57l-12 65" class="line" stroke="#fff4a5"/>
        </g>

        <!-- small yellow top flower -->
        <g filter="url(#glow)">
          <path d="M220 134l28-20 31 8 21 23-12 29-38 8-31-20z" fill="#ead88a"/><path d="M247 128l-8 48m30-50l-8 52m-40-26l76-5" class="line" stroke="#fff6bc"/>
        </g>

        <!-- main pink flower -->
        <g filter="url(#glow)">
          <path d="M205 210l38-23 44 9 20 31-15 35-48 14-39-22z" fill="#f7bad3"/><path d="M226 205l-4 50m24-61l-2 70m35-66l-20 62m45-51l-44 38" class="line" stroke="#ffe7f1"/>
        </g>

        <!-- cream flower -->
        <g filter="url(#glow)">
          <path d="M230 285l31-31 45 3 29 29-12 43-49 17-42-23z" fill="#f8d3ad"/><path d="M255 280l-8 58m36-67l-18 78m46-72l-42 62m61-39l-69 26" class="line" stroke="#fff1cc"/>
        </g>

        <!-- green center flower behind -->
        <g filter="url(#glow)"><path d="M160 190l24-25 42 4 27 25-10 35-39 18-38-20z" fill="url(#pGreen)"/><path d="M190 180l-15 58m40-54l-28 68m47-58l-40 57" class="line" stroke="#d1dc72"/></g>

        <!-- tall green flower -->
        <g filter="url(#glow)"><path d="M322 122l32-18 43 12 26 31-18 40-48 12-40-25z" fill="#b5c57a"/><path d="M350 116l-18 73m46-71l-31 76m61-59l-62 49m70-28l-77 18" class="line" stroke="#edf09e"/></g>

        <!-- pale top flower -->
        <g filter="url(#glow)"><path d="M303 178l23-22 39 5 29 24-12 35-41 12-38-20z" fill="#ebe9a5"/><path d="M325 177l-10 48m35-51l-20 61m48-54l-48 42" class="line" stroke="#fffbd0"/></g>

        <!-- red flower -->
        <g filter="url(#glow)"><path d="M420 218l36-21 44 13 22 35-16 40-49 10-42-24z" fill="#ee5362"/><path d="M450 207l-12 78m40-76l-32 82m58-58l-71 47m82-17l-84 7" class="line" stroke="#ffac9e"/></g>

        <!-- purple flower -->
        <g filter="url(#glow)"><path d="M105 330l30-30 45 8 27 33-13 39-43 12-41-21z" fill="#5d607c"/><path d="M132 317l-8 66m34-73l-18 80m43-78l-34 80m50-51l-63 38" class="line" stroke="#9a9aa9"/></g>

        <!-- lower green leaves -->
        <g filter="url(#glow)"><path d="M142 354l24-24 55 7 35 27-15 39-54 13-43-24z" fill="url(#pGreen)"/><path d="M170 350l-14 60m39-65l-28 75m51-70l-44 68m68-58l-72 47" class="line" stroke="#c2d56e"/></g>
        <g filter="url(#glow)"><path d="M318 350l27-24 52 9 32 31-16 42-53 11-44-28z" fill="url(#pGreen)"/><path d="M348 347l-10 65m38-65l-25 71m52-68l-56 66m72-54l-79 48" class="line" stroke="#c8db75"/></g>

        <!-- foil and wrapper -->
        <g filter="url(#glow)">
          <path d="M162 392l48-31 86 13 42-27 64 25-22 168-176-15z" fill="#607f39" opacity=".78"/>
          <path d="M204 376l25 154m50-145l-8 157m76-161l-40 161" class="line" stroke="#bfce72"/>
          <path d="M180 414l43 13 84-10 71 13M183 448l56 12 70-8 61 12M194 483l66 11 54-9 54 12" class="line" stroke="#d3df80"/>
          <path d="M260 392l18 142m35-145l-4 148m63-142l-48 141" class="line dash" stroke="#9eb866"/>
        </g>

        <!-- ribbon -->
        <g filter="url(#glow)"><path d="M198 508l172 18-10 43-154-19z" fill="#b98d78"/><path d="M205 518l159 17m-155 10l151 16" class="line" stroke="#dec7ad"/><path d="M275 532l-18 68m37-64l22 66" class="line" stroke="#61a769"/></g>
      </svg>
    </section>

    <section class="dedication">
      <span class="divider"></span>
      <p>Пусть каждый день цветёт яркими красками</p>
      <strong>С любовью и нежностью</strong>
    </section>
  </main>
  <script>
    const svg = document.querySelector(".bouquet-wrap svg");
    const ns = "http://www.w3.org/2000/svg";
    const pixel = (x, y, color, size = 4) => {
      const rect = document.createElementNS(ns, "rect");
      rect.setAttribute("x", x.toFixed(1));
      rect.setAttribute("y", y.toFixed(1));
      rect.setAttribute("width", size);
      rect.setAttribute("height", size);
      rect.setAttribute("fill", color);
      rect.setAttribute("filter", "url(#pixelGlow)");
      rect.setAttribute("opacity", ".95");
      art.appendChild(rect);
    };
    const line = (x1, y1, x2, y2, color, width = 2) => {
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", `M${x1} ${y1}L${x2} ${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", width);
      path.setAttribute("stroke-linecap", "square");
      path.setAttribute("filter", "url(#pixelGlow)");
      art.appendChild(path);
    };
    const dotColors = (base, light, dark) => [base, base, base, light, dark];

    svg.replaceChildren();
    svg.setAttribute("viewBox", "0 0 620 620");
    const defs = document.createElementNS(ns, "defs");
    defs.innerHTML = `
      <filter id="pixelGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>`;
    svg.appendChild(defs);
    const art = document.createElementNS(ns, "g");
    art.setAttribute("transform", "translate(-62 -20) scale(1.2 1.05)");
    svg.appendChild(art);

    const stems = [
      [174, 207], [140, 316], [304, 316], [304, 164], [442, 222],
      [405, 350], [478, 338], [247, 264], [366, 270], [242, 365], [355, 362]
    ];
    stems.forEach(([x, y], flowerIndex) => {
      const endX = 270 + flowerIndex * 12;
      const startY = y + 34;
      for (let step = 0; step <= 28; step++) {
        const t = step / 28;
        const px = x + (endX - x) * t + Math.sin(t * Math.PI) * (flowerIndex - 3) * 8;
        const py = startY + (535 - startY) * t;
        pixel(px, py, step % 4 === 0 ? "#b5d86b" : "#62bd68", 3);
      }
    });

    const leaves = [
      [225,365,-1], [250,400,-1], [365,370,1], [392,405,1],
      [286,430,-1], [340,445,1], [205,430,-1], [425,430,1]
    ];
    leaves.forEach(([x, y, direction], index) => {
      for (let step = 0; step < 13; step++) {
        const px = x + direction * step * 5;
        const py = y - step * 2.2;
        pixel(px, py, index % 2 ? "#87ce62" : "#65bd60", 3.2);
      }
    });

    const flowers = [
      { x:174, y:207, rx:51, ry:38, colors:["#f47fc4","#ffb5df","#d94e9f"], center:"#ffe45e" },
      { x:140, y:316, rx:51, ry:36, colors:["#f2d52e","#fff06a","#d6a916"], center:"#ff9a37" },
      { x:304, y:316, rx:55, ry:42, colors:["#f6a5d5","#ffd1ec","#d96fb6"], center:"#ffe98a" },
      { x:304, y:164, rx:53, ry:39, colors:["#dce88a","#f5f2b1","#9bc86b"], center:"#ffd83f" },
      { x:442, y:222, rx:50, ry:39, colors:["#f24255","#ff7771","#c92945"], center:"#ffb34e" },
      { x:405, y:350, rx:42, ry:32, colors:["#77739a","#aea0c7","#514c78"], center:"#f3d54c" },
      { x:478, y:338, rx:24, ry:20, colors:["#f0d743","#fff17b","#d8ab28"], center:"#ff9e38" },
      { x:247, y:264, rx:34, ry:27, colors:["#f6b16a","#ffda86","#e87957"], center:"#fff078" },
      { x:366, y:270, rx:36, ry:29, colors:["#c888dc","#edb8ec","#936acb"], center:"#ffd96e" },
      { x:242, y:365, rx:32, ry:25, colors:["#fff0a0","#f5c955","#df9e4c"], center:"#f47fa5" },
      { x:355, y:362, rx:34, ry:26, colors:["#ff9b86","#ffc7a6","#e96b78"], center:"#ffe877" }
    ];
    flowers.forEach((flower, flowerIndex) => {
      const spacing = 7;
      for (let y = flower.y - flower.ry - 5; y <= flower.y + flower.ry + 5; y += spacing) {
        for (let x = flower.x - flower.rx - 5; x <= flower.x + flower.rx + 5; x += spacing) {
          let inside = Math.pow((x - flower.x) / (flower.rx * .53), 2)
            + Math.pow((y - flower.y) / (flower.ry * .53), 2) <= 1;
          for (let petal = 0; petal < 5 && !inside; petal++) {
            const angle = (Math.PI * 2 * petal / 5) - Math.PI / 2;
            const cx = flower.x + Math.cos(angle) * flower.rx * .49;
            const cy = flower.y + Math.sin(angle) * flower.ry * .49;
            inside = Math.pow((x - cx) / (flower.rx * .52), 2)
              + Math.pow((y - cy) / (flower.ry * .55), 2) <= 1;
          }
          if (!inside) continue;
          const center = Math.pow((x - flower.x) / 12, 2) + Math.pow((y - flower.y) / 10, 2) < 1;
          const palette = center ? [flower.center, "#fff3a1"] : flower.colors;
          const color = palette[Math.abs(Math.floor(x * 3 + y * 7 + flowerIndex)) % palette.length];
          pixel(x, y, color, center ? 4.5 : 4);
        }
      }
      for (let petal = 0; petal < 5; petal++) {
        const angle = (Math.PI * 2 * petal / 5) - Math.PI / 2;
        const cx = flower.x + Math.cos(angle) * flower.rx * .49;
        const cy = flower.y + Math.sin(angle) * flower.ry * .49;
        for (let tick = -1; tick <= 1; tick++) {
          pixel(cx + tick * 8, cy + 2, "#fff5d5", 2);
        }
      }
    });

    for (let y = 380; y <= 505; y += 7) {
      const inset = (y - 380) * .32;
      for (let x = 160 + inset; x <= 460 - inset; x += 7) {
        const seed = Math.abs(Math.floor(x * 13 + y * 17));
        if (seed % 5 !== 0 && seed % 7 !== 0) {
          pixel(x, y, seed % 4 === 0 ? "#a5d861" : seed % 3 === 0 ? "#4ea75c" : "#6fbd5c", 3);
        }
      }
    }

    for (let y = 388; y <= 582; y += 6) {
      const t = (y - 386) / 199;
      const left = 156 + 120 * t;
      const right = 461 - 117 * t;
      for (let x = left; x <= right; x += 6) {
        const shade = Math.abs(Math.floor(x * 3 + y * 5)) % 5;
        pixel(x, y, ["#578b43", "#6da94b", "#85b751", "#497f41", "#a4c65e"][shade], 3.2);
      }
    }
    line(156,386,276,585,"#9dce61",2.4);
    line(461,382,344,585,"#9dce61",2.4);
    line(218,399,292,585,"#c0d875",1.6);
    line(400,399,329,585,"#c0d875",1.6);
    line(280,396,305,585,"#8ac45e",1.3);
    line(332,395,316,585,"#8ac45e",1.3);
    for (let y = 410; y < 560; y += 24) {
      const t = (y - 386) / 199;
      line(164 + 120 * t, y, 453 - 117 * t, y - 4, "#aacd69", 1);
    }

    for (let x = 253; x < 372; x += 7) {
      pixel(x, 512 + (x - 253) * .04, x % 2 ? "#f8a6ca" : "#ffd3df", 4);
      pixel(x, 523 + (x - 253) * .04, "#f18db6", 3);
    }
    for (let i = 0; i < 10; i++) {
      pixel(278 - i * 2, 525 + i * 6, "#75c56a", 3);
      pixel(342 + i * 2, 525 + i * 6, "#75c56a", 3);
    }
  </script>
</body>
</html>
